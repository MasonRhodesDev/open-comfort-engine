# On a v* tag: build, pack both packages, attach the tarballs to a GitHub Release.
# (npm publish comes later.)
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm pack -w open-comfort-engine -w node-red-contrib-open-comfort-engine
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/node-red-contrib-open-comfort-engine-${v}.tgz"
          printf 'Open Comfort Engine %s.\n\nInstall in Node-RED (user directory or Manage palette upload):\n\n    npm install %s\n' "$v" "$url" > notes.md
          gh release create "${GITHUB_REF_NAME}" *.tgz --title "${GITHUB_REF_NAME}" --notes-file notes.md
