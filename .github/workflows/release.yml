# On a v* tag: build, pack both packages, attach the tarballs to a GitHub Release.
# (npm publish comes later.)
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm pack -w open-comfort-engine -w node-red-contrib-open-comfort-engine
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" *.tgz --title "${GITHUB_REF_NAME}" --notes "Spec $(node -p "require('./packages/core/package.json').version"). Install in Node-RED: npm install https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/node-red-contrib-open-comfort-engine-${GITHUB_REF_NAME#v}.tgz"
